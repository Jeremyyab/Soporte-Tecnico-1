<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="1200" height="800" rx="36" fill="#f6f9fd"/>
  <text x="600" y="84" text-anchor="middle" font-size="42" font-weight="800" fill="#0a4f96">M.2 es el formato, no la velocidad</text>

  <!-- SSD 2.5 SATA -->
  <g transform="translate(60 150)">
    <rect width="1080" height="160" rx="24" fill="#fff" stroke="#cfd9e6" stroke-width="3"/>
    <rect x="40" y="30" width="170" height="100" rx="10" fill="#334155"/>
    <rect x="60" y="50" width="100" height="22" rx="4" fill="#94a3b8"/>
    <rect x="210" y="62" width="20" height="36" fill="#facc15"/>
    <text x="280" y="70" font-size="30" font-weight="800" fill="#0f172a">SSD 2.5" SATA</text>
    <text x="280" y="108" font-size="22" fill="#50607a">Cable SATA de datos + cable de energía SATA</text>
    <rect x="830" y="45" width="220" height="70" rx="16" fill="#e0ecf9"/>
    <text x="940" y="80" text-anchor="middle" font-size="26" font-weight="800" fill="#0a4f96">≈ 550 MB/s</text>
    <text x="940" y="104" text-anchor="middle" font-size="17" fill="#50607a">límite de SATA</text>
  </g>

  <!-- M.2 SATA -->
  <g transform="translate(60 335)">
    <rect width="1080" height="160" rx="24" fill="#fff" stroke="#cfd9e6" stroke-width="3"/>
    <rect x="40" y="55" width="200" height="50" rx="4" fill="#0f172a"/>
    <rect x="60" y="64" width="44" height="32" fill="#334155"/><rect x="120" y="64" width="44" height="32" fill="#334155"/>
    <rect x="240" y="58" width="22" height="44" fill="#facc15"/>
    <rect x="240" y="64" width="22" height="7" fill="#fff"/><rect x="240" y="88" width="22" height="7" fill="#fff"/>
    <text x="300" y="70" font-size="30" font-weight="800" fill="#0f172a">M.2 SATA</text>
    <text x="300" y="108" font-size="22" fill="#50607a">Llave B+M (dos muescas) · usa protocolo SATA</text>
    <rect x="830" y="45" width="220" height="70" rx="16" fill="#e0ecf9"/>
    <text x="940" y="80" text-anchor="middle" font-size="26" font-weight="800" fill="#0a4f96">≈ 550 MB/s</text>
    <text x="940" y="104" text-anchor="middle" font-size="17" fill="#50607a">igual que SATA</text>
  </g>

  <!-- M.2 NVMe -->
  <g transform="translate(60 520)">
    <rect width="1080" height="160" rx="24" fill="#fff" stroke="#0b66c3" stroke-width="4"/>
    <rect x="40" y="55" width="200" height="50" rx="4" fill="#0f172a"/>
    <rect x="60" y="64" width="44" height="32" fill="#334155"/><rect x="120" y="64" width="44" height="32" fill="#334155"/><rect x="178" y="68" width="36" height="24" fill="#475569"/>
    <rect x="240" y="58" width="22" height="44" fill="#facc15"/>
    <rect x="240" y="88" width="22" height="7" fill="#fff"/>
    <text x="300" y="70" font-size="30" font-weight="800" fill="#0f172a">M.2 NVMe</text>
    <text x="300" y="108" font-size="22" fill="#50607a">Llave M (una muesca) · usa líneas PCIe</text>
    <rect x="830" y="45" width="220" height="70" rx="16" fill="#0b66c3"/>
    <text x="940" y="80" text-anchor="middle" font-size="26" font-weight="800" fill="#fff">3 500–7 000</text>
    <text x="940" y="104" text-anchor="middle" font-size="17" fill="#e0ecf9">MB/s (PCIe 3.0 / 4.0)</text>
  </g>

  <text x="600" y="735" text-anchor="middle" font-size="24" fill="#0f172a">Antes de comprar: el manual dice si el slot M.2 acepta <tspan font-weight="800">SATA, NVMe o ambos</tspan>.</text>
</svg>
