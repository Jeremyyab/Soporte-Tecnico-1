<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="1200" height="800" rx="36" fill="#f6f9fd"/>
  <text x="600" y="92" text-anchor="middle" font-size="44" font-weight="800" fill="#0a4f96">Evolución de la computadora personal</text>
  <line x1="110" y1="420" x2="1090" y2="420" stroke="#0b66c3" stroke-width="10" stroke-linecap="round"/>

  <!-- 1975 -->
  <g transform="translate(190 0)">
    <circle cx="0" cy="420" r="26" fill="#fff" stroke="#0b66c3" stroke-width="8"/>
    <text x="0" y="490" text-anchor="middle" font-size="40" font-weight="800" fill="#0f172a">1975</text>
    <rect x="-95" y="190" width="190" height="120" rx="12" fill="#cfdceb" stroke="#0a4f96" stroke-width="4"/>
    <g fill="#0b66c3"><circle cx="-60" cy="270" r="9"/><circle cx="-30" cy="270" r="9"/><circle cx="0" cy="270" r="9"/><circle cx="30" cy="270" r="9"/><circle cx="60" cy="270" r="9"/></g>
    <g fill="#dc2626"><circle cx="-60" cy="225" r="6"/><circle cx="-30" cy="225" r="6"/><circle cx="0" cy="225" r="6"/><circle cx="30" cy="225" r="6"/><circle cx="60" cy="225" r="6"/></g>
    <text x="0" y="540" text-anchor="middle" font-size="26" font-weight="700" fill="#0a4f96">Altair 8800</text>
    <text x="0" y="574" text-anchor="middle" font-size="22" fill="#50607a">Kit para armar</text>
    <text x="0" y="602" text-anchor="middle" font-size="22" fill="#50607a">y programar</text>
  </g>

  <!-- 1976 -->
  <g transform="translate(430 0)">
    <circle cx="0" cy="420" r="26" fill="#fff" stroke="#0b66c3" stroke-width="8"/>
    <text x="0" y="490" text-anchor="middle" font-size="40" font-weight="800" fill="#0f172a">1976</text>
    <rect x="-90" y="200" width="180" height="110" rx="8" fill="#e8d9b5" stroke="#7a5b2a" stroke-width="4"/>
    <rect x="-70" y="220" width="140" height="70" rx="4" fill="#3f6b3a"/>
    <g fill="#c9b37e"><rect x="-60" y="232" width="20" height="10"/><rect x="-30" y="232" width="20" height="10"/><rect x="0" y="232" width="20" height="10"/><rect x="30" y="232" width="20" height="10"/><rect x="-60" y="262" width="20" height="10"/><rect x="-30" y="262" width="20" height="10"/><rect x="0" y="262" width="20" height="10"/></g>
    <text x="0" y="540" text-anchor="middle" font-size="26" font-weight="700" fill="#0a4f96">Apple I</text>
    <text x="0" y="574" text-anchor="middle" font-size="22" fill="#50607a">Placa ensamblada,</text>
    <text x="0" y="602" text-anchor="middle" font-size="22" fill="#50607a">sin gabinete</text>
  </g>

  <!-- 1981 -->
  <g transform="translate(670 0)">
    <circle cx="0" cy="420" r="26" fill="#0b66c3" stroke="#0b66c3" stroke-width="8"/>
    <text x="0" y="490" text-anchor="middle" font-size="40" font-weight="800" fill="#0f172a">1981</text>
    <rect x="-80" y="170" width="160" height="110" rx="8" fill="#e5e7eb" stroke="#475569" stroke-width="4"/>
    <rect x="-62" y="186" width="124" height="76" rx="4" fill="#0f172a"/>
    <text x="-50" y="220" font-size="18" font-family="Consolas, monospace" fill="#22c55e">C:\&gt;_</text>
    <rect x="-95" y="285" width="190" height="34" rx="6" fill="#e5e7eb" stroke="#475569" stroke-width="4"/>
    <text x="0" y="540" text-anchor="middle" font-size="26" font-weight="700" fill="#0a4f96">IBM PC + MS-DOS</text>
    <text x="0" y="574" text-anchor="middle" font-size="22" fill="#50607a">Nace el estándar</text>
    <text x="0" y="602" text-anchor="middle" font-size="22" fill="#50607a">"compatible PC"</text>
  </g>

  <!-- 1990s -->
  <g transform="translate(910 0)">
    <circle cx="0" cy="420" r="26" fill="#fff" stroke="#0b66c3" stroke-width="8"/>
    <text x="0" y="490" text-anchor="middle" font-size="40" font-weight="800" fill="#0f172a">1990s</text>
    <rect x="-90" y="175" width="180" height="125" rx="10" fill="#e5e7eb" stroke="#475569" stroke-width="4"/>
    <rect x="-74" y="190" width="148" height="95" rx="4" fill="#0e7490"/>
    <rect x="-64" y="200" width="70" height="46" rx="3" fill="#fff"/><rect x="-64" y="200" width="70" height="10" fill="#0a4f96"/>
    <rect x="14" y="220" width="50" height="36" rx="3" fill="#fff"/><rect x="14" y="220" width="50" height="9" fill="#0a4f96"/>
    <rect x="-74" y="272" width="148" height="13" fill="#cbd5e1"/>
    <text x="0" y="540" text-anchor="middle" font-size="26" font-weight="700" fill="#0a4f96">Interfaz gráfica</text>
    <text x="0" y="574" text-anchor="middle" font-size="22" fill="#50607a">Windows, ventanas</text>
    <text x="0" y="602" text-anchor="middle" font-size="22" fill="#50607a">y mouse para todos</text>
  </g>

  <rect x="150" y="660" width="900" height="76" rx="18" fill="#fff" stroke="#cfd9e6" stroke-width="3"/>
  <text x="600" y="708" text-anchor="middle" font-size="26" fill="#0f172a">Del kit para aficionados al <tspan font-weight="800" fill="#0b66c3">estándar compatible</tspan> que usamos hoy</text>
</svg>
