<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <g id="disk">
      <rect width="62" height="190" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
    </g>
  </defs>
  <rect width="1200" height="800" rx="36" fill="#f6f9fd"/>
  <text x="600" y="78" text-anchor="middle" font-size="42" font-weight="800" fill="#0a4f96">Niveles RAID más comunes</text>

  <g font-size="20" font-weight="800" text-anchor="middle">
  <!-- RAID 0 -->
  <g transform="translate(40 120)">
    <rect width="260" height="610" rx="24" fill="#fff" stroke="#dc2626" stroke-width="4"/>
    <text x="130" y="50" font-size="32" fill="#0f172a">RAID 0</text>
    <text x="130" y="80" font-size="18" font-weight="400" fill="#50607a">Striping (reparte)</text>
    <g transform="translate(55 110)"><use href="#disk"/>
      <rect x="8" y="14" width="46" height="34" rx="5" fill="#0b66c3"/><text x="31" y="38" fill="#fff">A1</text>
      <rect x="8" y="58" width="46" height="34" rx="5" fill="#0b66c3"/><text x="31" y="82" fill="#fff">A3</text>
      <rect x="8" y="102" width="46" height="34" rx="5" fill="#0b66c3"/><text x="31" y="126" fill="#fff">A5</text></g>
    <g transform="translate(143 110)"><use href="#disk"/>
      <rect x="8" y="14" width="46" height="34" rx="5" fill="#0b66c3"/><text x="31" y="38" fill="#fff">A2</text>
      <rect x="8" y="58" width="46" height="34" rx="5" fill="#0b66c3"/><text x="31" y="82" fill="#fff">A4</text>
      <rect x="8" y="102" width="46" height="34" rx="5" fill="#0b66c3"/><text x="31" y="126" fill="#fff">A6</text></g>
    <g font-weight="400" font-size="19" fill="#0f172a">
      <text x="130" y="350">Mín. 2 discos</text>
      <text x="130" y="385">Capacidad: 100 %</text>
      <text x="130" y="420">Velocidad: muy alta</text>
    </g>
    <rect x="20" y="450" width="220" height="120" rx="16" fill="#fee2e2"/>
    <text x="130" y="492" fill="#b91c1c">Falla 1 disco =</text>
    <text x="130" y="522" fill="#b91c1c">se pierde TODO</text>
  </g>

  <!-- RAID 1 -->
  <g transform="translate(325 120)">
    <rect width="260" height="610" rx="24" fill="#fff" stroke="#16a34a" stroke-width="4"/>
    <text x="130" y="50" font-size="32" fill="#0f172a">RAID 1</text>
    <text x="130" y="80" font-size="18" font-weight="400" fill="#50607a">Mirroring (espejo)</text>
    <g transform="translate(55 110)"><use href="#disk"/>
      <rect x="8" y="14" width="46" height="34" rx="5" fill="#16a34a"/><text x="31" y="38" fill="#fff">A1</text>
      <rect x="8" y="58" width="46" height="34" rx="5" fill="#16a34a"/><text x="31" y="82" fill="#fff">A2</text>
      <rect x="8" y="102" width="46" height="34" rx="5" fill="#16a34a"/><text x="31" y="126" fill="#fff">A3</text></g>
    <g transform="translate(143 110)"><use href="#disk"/>
      <rect x="8" y="14" width="46" height="34" rx="5" fill="#16a34a"/><text x="31" y="38" fill="#fff">A1</text>
      <rect x="8" y="58" width="46" height="34" rx="5" fill="#16a34a"/><text x="31" y="82" fill="#fff">A2</text>
      <rect x="8" y="102" width="46" height="34" rx="5" fill="#16a34a"/><text x="31" y="126" fill="#fff">A3</text></g>
    <g font-weight="400" font-size="19" fill="#0f172a">
      <text x="130" y="350">Mín. 2 discos</text>
      <text x="130" y="385">Capacidad: 50 %</text>
      <text x="130" y="420">Lectura: buena</text>
    </g>
    <rect x="20" y="450" width="220" height="120" rx="16" fill="#dcfce7"/>
    <text x="130" y="492" fill="#15803d">Aguanta la falla</text>
    <text x="130" y="522" fill="#15803d">de 1 disco</text>
  </g>

  <!-- RAID 5 -->
  <g transform="translate(610 120)">
    <rect width="260" height="610" rx="24" fill="#fff" stroke="#0b66c3" stroke-width="4"/>
    <text x="130" y="50" font-size="32" fill="#0f172a">RAID 5</text>
    <text x="130" y="80" font-size="18" font-weight="400" fill="#50607a">Datos + paridad</text>
    <g transform="translate(20 110)"><use href="#disk"/>
      <rect x="8" y="14" width="46" height="34" rx="5" fill="#0b66c3"/><text x="31" y="38" fill="#fff">A1</text>
      <rect x="8" y="58" width="46" height="34" rx="5" fill="#0b66c3"/><text x="31" y="82" fill="#fff">B1</text>
      <rect x="8" y="102" width="46" height="34" rx="5" fill="#f59e0b"/><text x="31" y="126" fill="#fff">Cp</text></g>
    <g transform="translate(99 110)"><use href="#disk"/>
      <rect x="8" y="14" width="46" height="34" rx="5" fill="#0b66c3"/><text x="31" y="38" fill="#fff">A2</text>
      <rect x="8" y="58" width="46" height="34" rx="5" fill="#f59e0b"/><text x="31" y="82" fill="#fff">Bp</text>
      <rect x="8" y="102" width="46" height="34" rx="5" fill="#0b66c3"/><text x="31" y="126" fill="#fff">C1</text></g>
    <g transform="translate(178 110)"><use href="#disk"/>
      <rect x="8" y="14" width="46" height="34" rx="5" fill="#f59e0b"/><text x="31" y="38" fill="#fff">Ap</text>
      <rect x="8" y="58" width="46" height="34" rx="5" fill="#0b66c3"/><text x="31" y="82" fill="#fff">B2</text>
      <rect x="8" y="102" width="46" height="34" rx="5" fill="#0b66c3"/><text x="31" y="126" fill="#fff">C2</text></g>
    <g font-weight="400" font-size="19" fill="#0f172a">
      <text x="130" y="350">Mín. 3 discos</text>
      <text x="130" y="385">Capacidad: n − 1 discos</text>
      <text x="130" y="420">Equilibrio general</text>
    </g>
    <rect x="20" y="450" width="220" height="120" rx="16" fill="#e0ecf9"/>
    <text x="130" y="492" fill="#0a4f96">Aguanta la falla</text>
    <text x="130" y="522" fill="#0a4f96">de 1 disco</text>
  </g>

  <!-- RAID 10 -->
  <g transform="translate(895 120)">
    <rect width="265" height="610" rx="24" fill="#fff" stroke="#7c3aed" stroke-width="4"/>
    <text x="132" y="50" font-size="32" fill="#0f172a">RAID 10</text>
    <text x="132" y="80" font-size="18" font-weight="400" fill="#50607a">Espejos + striping</text>
    <g transform="scale(0.8) translate(14 140)">
      <g transform="translate(0 0)"><use href="#disk"/><rect x="8" y="14" width="46" height="34" rx="5" fill="#7c3aed"/><text x="31" y="38" fill="#fff">A1</text><rect x="8" y="58" width="46" height="34" rx="5" fill="#7c3aed"/><text x="31" y="82" fill="#fff">A3</text></g>
      <g transform="translate(70 0)"><use href="#disk"/><rect x="8" y="14" width="46" height="34" rx="5" fill="#7c3aed"/><text x="31" y="38" fill="#fff">A1</text><rect x="8" y="58" width="46" height="34" rx="5" fill="#7c3aed"/><text x="31" y="82" fill="#fff">A3</text></g>
      <g transform="translate(160 0)"><use href="#disk"/><rect x="8" y="14" width="46" height="34" rx="5" fill="#a78bfa"/><text x="31" y="38" fill="#fff">A2</text><rect x="8" y="58" width="46" height="34" rx="5" fill="#a78bfa"/><text x="31" y="82" fill="#fff">A4</text></g>
      <g transform="translate(230 0)"><use href="#disk"/><rect x="8" y="14" width="46" height="34" rx="5" fill="#a78bfa"/><text x="31" y="38" fill="#fff">A2</text><rect x="8" y="58" width="46" height="34" rx="5" fill="#a78bfa"/><text x="31" y="82" fill="#fff">A4</text></g>
    </g>
    <g font-weight="400" font-size="19" fill="#0f172a">
      <text x="132" y="350">Mín. 4 discos</text>
      <text x="132" y="385">Capacidad: 50 %</text>
      <text x="132" y="420">Rápido y redundante</text>
    </g>
    <rect x="20" y="450" width="225" height="120" rx="16" fill="#ede9fe"/>
    <text x="132" y="492" fill="#6d28d9">1 disco por espejo</text>
    <text x="132" y="522" fill="#6d28d9">puede fallar</text>
  </g>
  </g>
  <text x="600" y="772" text-anchor="middle" font-size="22" font-weight="800" fill="#dc2626">Ningún RAID reemplaza un respaldo (backup).</text>
</svg>
