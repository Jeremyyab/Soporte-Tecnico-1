<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#0b66c3"/></marker>
  </defs>
  <rect width="1200" height="800" rx="36" fill="#f6f9fd"/>
  <text x="600" y="86" text-anchor="middle" font-size="42" font-weight="800" fill="#0a4f96">Entrada → Procesamiento → Salida</text>

  <!-- columnas -->
  <rect x="50" y="140" width="330" height="560" rx="26" fill="#fff" stroke="#cfd9e6" stroke-width="3"/>
  <rect x="435" y="240" width="330" height="360" rx="26" fill="#0a4f96"/>
  <rect x="820" y="140" width="330" height="560" rx="26" fill="#fff" stroke="#cfd9e6" stroke-width="3"/>
  <text x="215" y="190" text-anchor="middle" font-size="30" font-weight="800" fill="#0b66c3">ENTRADA</text>
  <text x="985" y="190" text-anchor="middle" font-size="30" font-weight="800" fill="#0b66c3">SALIDA</text>
  <line x1="388" y1="420" x2="425" y2="420" stroke="#0b66c3" stroke-width="10" marker-end="url(#ar)"/>
  <line x1="773" y1="420" x2="810" y2="420" stroke="#0b66c3" stroke-width="10" marker-end="url(#ar)"/>

  <!-- teclado -->
  <g transform="translate(90 230)">
    <rect width="110" height="56" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
    <g fill="#94a3b8"><rect x="10" y="10" width="14" height="12" rx="2"/><rect x="30" y="10" width="14" height="12" rx="2"/><rect x="50" y="10" width="14" height="12" rx="2"/><rect x="70" y="10" width="14" height="12" rx="2"/><rect x="88" y="10" width="12" height="12" rx="2"/><rect x="10" y="30" width="14" height="12" rx="2"/><rect x="30" y="30" width="50" height="12" rx="2"/><rect x="86" y="30" width="14" height="12" rx="2"/></g>
    <text x="130" y="38" font-size="24" fill="#0f172a">Teclado</text>
  </g>
  <!-- mouse -->
  <g transform="translate(118 320)">
    <rect width="54" height="80" rx="27" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
    <line x1="27" y1="4" x2="27" y2="32" stroke="#475569" stroke-width="3"/>
    <text x="102" y="48" font-size="24" fill="#0f172a">Mouse / trackpad</text>
  </g>
  <!-- micrófono -->
  <g transform="translate(125 430)">
    <rect x="6" y="0" width="30" height="50" rx="15" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
    <path d="M0 34 a21 21 0 0 0 42 0" fill="none" stroke="#475569" stroke-width="3"/>
    <line x1="21" y1="56" x2="21" y2="72" stroke="#475569" stroke-width="3"/>
    <text x="95" y="44" font-size="24" fill="#0f172a">Micrófono</text>
  </g>
  <!-- webcam -->
  <g transform="translate(118 530)">
    <circle cx="28" cy="28" r="28" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
    <circle cx="28" cy="28" r="12" fill="#0f172a"/><circle cx="32" cy="24" r="4" fill="#fff"/>
    <text x="102" y="36" font-size="24" fill="#0f172a">Webcam</text>
  </g>

  <!-- procesamiento -->
  <g transform="translate(600 360)">
    <rect x="-70" y="-70" width="140" height="140" rx="14" fill="#cfdceb"/>
    <rect x="-44" y="-44" width="88" height="88" rx="8" fill="#0b66c3"/>
    <g stroke="#cfdceb" stroke-width="6"><line x1="-50" y1="-90" x2="-50" y2="-70"/><line x1="-17" y1="-90" x2="-17" y2="-70"/><line x1="17" y1="-90" x2="17" y2="-70"/><line x1="50" y1="-90" x2="50" y2="-70"/><line x1="-50" y1="70" x2="-50" y2="90"/><line x1="-17" y1="70" x2="-17" y2="90"/><line x1="17" y1="70" x2="17" y2="90"/><line x1="50" y1="70" x2="50" y2="90"/></g>
    <text x="0" y="10" text-anchor="middle" font-size="28" font-weight="800" fill="#fff">CPU</text>
  </g>
  <text x="600" y="530" text-anchor="middle" font-size="30" font-weight="800" fill="#fff">PROCESAMIENTO</text>
  <text x="600" y="568" text-anchor="middle" font-size="22" fill="#cfdceb">CPU · RAM · disco</text>

  <!-- monitor -->
  <g transform="translate(860 225)">
    <rect width="104" height="66" rx="6" fill="#0f172a" stroke="#475569" stroke-width="3"/>
    <rect x="44" y="66" width="16" height="12" fill="#475569"/><rect x="28" y="78" width="48" height="6" rx="3" fill="#475569"/>
    <text x="124" y="48" font-size="24" fill="#0f172a">Monitor</text>
  </g>
  <!-- parlantes -->
  <g transform="translate(870 330)">
    <rect width="40" height="66" rx="6" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
    <circle cx="20" cy="42" r="12" fill="#94a3b8"/><circle cx="20" cy="16" r="6" fill="#94a3b8"/>
    <rect x="48" y="0" width="40" height="66" rx="6" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
    <circle cx="68" cy="42" r="12" fill="#94a3b8"/><circle cx="68" cy="16" r="6" fill="#94a3b8"/>
    <text x="114" y="42" font-size="24" fill="#0f172a">Parlantes /</text>
    <text x="114" y="70" font-size="24" fill="#0f172a">audífonos</text>
  </g>
  <!-- impresora -->
  <g transform="translate(860 450)">
    <rect x="14" y="0" width="76" height="22" fill="#fff" stroke="#475569" stroke-width="3"/>
    <rect x="0" y="20" width="104" height="44" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
    <rect x="18" y="52" width="68" height="26" fill="#fff" stroke="#475569" stroke-width="3"/>
    <text x="124" y="48" font-size="24" fill="#0f172a">Impresora</text>
  </g>
  <!-- proyector -->
  <g transform="translate(860 560)">
    <rect width="104" height="50" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
    <circle cx="30" cy="25" r="15" fill="#0f172a"/><circle cx="30" cy="25" r="6" fill="#38bdf8"/>
    <text x="124" y="34" font-size="24" fill="#0f172a">Proyector</text>
  </g>
</svg>
